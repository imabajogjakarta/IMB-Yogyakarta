<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendataan Anggota IMABA Yogyakarta</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            color: #0b5c3e;
            border-bottom: 2px solid #0b5c3e;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 13px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #0b5c3e;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
        }
        button:hover {
            background-color: #08422c;
        }
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Pendataan Anggota IMABA</h2>
        
        <form id="formSensus">
            <div class="form-group">
                <label>1. NAMA LENGKAP *</label>
                <input type="text" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>2. NOMOR WHATSAPP *</label>
                    <input type="number" name="whatsapp" placeholder="Contoh: 08123456789" required>
                </div>
                <div class="form-group">
                    <label>3. ANGKATAN *</label>
                    <input type="number" name="angkatan" placeholder="Contoh: 2024" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>4. KAMPUS *</label>
                    <input type="text" name="kampus" placeholder="Contoh: UIN Sunan Kalijaga" required>
                </div>
                <div class="form-group">
                    <label>5. PROGRAM STUDI *</label>
                    <input type="text" name="prodi" placeholder="Contoh: Ilmu Hukum" required>
                </div>
            </div>

            <div class="form-group">
                <label>6. ALAMAT ASAL *</label>
                <input type="text" name="alamat_asal" placeholder="Tuliskan desa/kecamatan/kabupaten asal" required>
            </div>

            <div class="form-group">
                <label>7. DEPARTEMEN DI IMABA *</label>
                <select name="departemen" required>
                    <option value="" disabled selected>Pilih Departemen...</option>
                    <option value="BPH (Badan Pengurus Harian)">BPH (Badan Pengurus Harian)</option>
                    <option value="Kaderisasi">Kaderisasi</option>
                    <option value="Keilmuan">Keilmuan</option>
                    <option value="Kominfo">Kominfo</option>
                    <option value="Kewirausahaan / Ekonomi">Kewirausahaan / Ekonomi</option>
                    <option value="Keagamaan">Keagamaan</option>
                    <option value="Lainnya">Lainnya / Belum Masuk Departemen</option>
                </select>
            </div>

            <button type="submit" id="btnSubmit">Kirim Data</button>
        </form>
    </div>

</body>
</html>
